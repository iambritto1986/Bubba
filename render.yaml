# Render Blueprint: one API service + one Postgres database.
# In Render: New > Blueprint > pick this repo. Secrets marked sync:false are prompted for.
databases:
  - name: bubba-db
    databaseName: bubba
    user: bubba
    plan: free   # free instances expire after a while on Render — bump to a paid plan before real users

services:
  - type: web
    name: bubba-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bubba-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: hRbsi7Sgd2GnL8siHYj9
      - key: ELEVENLABS_AGENT_ID
        value: agent_5801m5rjhr0webbbejbcg2szxhmz
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
